      <text x="24" y="12" font-size="12" font-weight="700" letter-spacing="1.6" fill="#C7C8D1">OPEN TO SOFTWARE ENGINEERING INTERNSHIPS</text>
    </g>

    <g transform="translate(738 38)">
      <rect width="416" height="304" rx="22" fill="#15161D" fill-opacity="0.78" stroke="#FFFFFF" stroke-opacity="0.09"/>
      <text x="24" y="35" font-size="11" font-weight="700" letter-spacing="2.6" fill="#858694">PRODUCT GRAPH / 06</text>

      <g stroke="#A78BFA" stroke-opacity="0.28" stroke-width="1.5">
        <path d="M208 153L90 89"/>
        <path d="M208 153L210 74"/>
        <path d="M208 153L327 102"/>
        <path d="M208 153L324 222"/>
        <path d="M208 153L206 258"/>
        <path d="M208 153L88 225"/>
