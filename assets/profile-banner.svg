<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title description">
  <title id="title">Kaylem — Hyzr</title>
  <description id="description">Software systems and applied mathematics. Open to software engineering internships.</description>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090A0E"/>
      <stop offset="0.54" stop-color="#101119"/>
      <stop offset="1" stop-color="#090B10"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F4EAD7"/>
      <stop offset="0.48" stop-color="#C4B5FD"/>
      <stop offset="1" stop-color="#67E8F9"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A78BFA" stop-opacity="0"/>
      <stop offset="0.48" stop-color="#A78BFA" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#67E8F9" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity="0.035"/>
    </pattern>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <rect width="1200" height="380" rx="28" fill="url(#background)"/>
  <rect x="1" y="1" width="1198" height="378" rx="27" fill="none" stroke="#FFFFFF" stroke-opacity="0.1"/>
  <rect x="1" y="1" width="1198" height="378" rx="27" fill="url(#grid)"/>
  <path d="M460 -30L865 410" stroke="url(#beam)" stroke-width="115"/>
  <circle cx="968" cy="176" r="122" fill="#8B5CF6" fill-opacity="0.07" filter="url(#glow)"/>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
