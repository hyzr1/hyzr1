        <g transform="translate(210 74)">
          <circle r="29" fill="#1B1C24" stroke="#A78BFA" stroke-opacity="0.58"/>
          <text y="4" fill="#EEE8FF">CODE</text>
        </g>
        <g transform="translate(327 102)">
          <circle r="29" fill="#1B1C24" stroke="#F4EAD7" stroke-opacity="0.46"/>
          <text y="4" fill="#F8F1E5">SHOP</text>
        </g>
        <g transform="translate(324 222)">
          <circle r="29" fill="#1B1C24" stroke="#6EE7B7" stroke-opacity="0.48"/>
          <text y="4" fill="#E1FFF2">TRADE</text>
        </g>
        <g transform="translate(206 258)">
          <circle r="29" fill="#1B1C24" stroke="#F9A8D4" stroke-opacity="0.48"/>
          <text y="4" fill="#FFE6F4">GL</text>
        </g>
        <g transform="translate(88 225)">
