      <text x="20" y="28" text-anchor="middle" font-size="21" font-weight="800" fill="#111217">H</text>
      <text x="54" y="17" font-size="12" font-weight="700" letter-spacing="2.8" fill="#A6A6B3">KAYLEM</text>
      <text x="54" y="37" font-size="13" font-weight="700" letter-spacing="2.5" fill="#F4EAD7">HYZR</text>
    </g>

    <text x="54" y="145" font-size="13" font-weight="700" letter-spacing="3.5" fill="#A78BFA">SOFTWARE SYSTEMS × APPLIED MATHEMATICS</text>
    <text x="52" y="204" font-size="50" font-weight="760" letter-spacing="-2.1" fill="url(#accent)">Building difficult things.</text>
    <text x="54" y="248" font-size="26" font-weight="520" letter-spacing="-0.5" fill="#D8D8E0">Making them feel simple.</text>
    <text x="54" y="287" font-size="15" fill="#8F909D">Developer tools · browser runtimes · data products · graphics · full-stack systems</text>

